name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # `work` is a legacy integration branch. CI is kept temporarily for transition.

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Canonical repository gate
        run: pnpm check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Responsive smoke
        run: pnpm e2e:responsive

      - name: Upload responsive visual audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: responsive-visual-audit
          path: test-results/visual-audit
          if-no-files-found: ignore
