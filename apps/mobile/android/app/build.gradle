apply plugin: 'com.android.application'

def alphaSigningPropertiesFile = new File(System.getProperty("user.home"), ".local-climate-link/android/alpha-signing.properties")
def alphaSigningProperties = new Properties()
if (alphaSigningPropertiesFile.exists()) {
    alphaSigningPropertiesFile.withInputStream { alphaSigningProperties.load(it) }
}
def alphaKeystoreFile = alphaSigningProperties.getProperty("storeFile")
def alphaKeystorePassword = alphaSigningProperties.getProperty("storePassword")
def alphaKeyAlias = alphaSigningProperties.getProperty("keyAlias")
def alphaKeyPassword = alphaSigningProperties.getProperty("keyPassword")
def hasAlphaSigning = alphaKeystoreFile && alphaKeystorePassword && alphaKeyAlias && alphaKeyPassword && new File(alphaKeystoreFile).exists()

def releaseKeystoreFile = System.getenv("LCL_ANDROID_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("LCL_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("LCL_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("LCL_ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystoreFile && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "link.localclimate.app"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasAlphaSigning) {
            alpha {
                storeFile file(alphaKeystoreFile)
                storePassword alphaKeystorePassword
                keyAlias alphaKeyAlias
                keyPassword alphaKeyPassword
            }
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "link.localclimate.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20009
        versionName "2.0.9"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (hasAlphaSigning) {
                signingConfig signingConfigs.alpha
            }
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
